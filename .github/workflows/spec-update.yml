name: Specification update

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"
      - run: pipx install poetry==2.5.1
      - run: poetry env use "${{ steps.python.outputs.python-path }}" && poetry install --with dev,examples
      - name: Download the specification and regenerate
        run: poetry run python -m codegen --fetch --summary "${RUNNER_TEMP}/summary.md"
      - name: Run the tests
        id: tests
        continue-on-error: true
        run: poetry run pytest -q
      - name: Pull request description
        run: |
          {
            cat "${RUNNER_TEMP}/summary.md"
            echo
            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              echo "Tests pass with the new specification."
            else
              echo "> [!WARNING]"
              echo "> Tests fail with the new specification, see the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
          } > "${RUNNER_TEMP}/body.md"
      - uses: peter-evans/create-pull-request@v8
        with:
          # A personal access token or app token lets CI run on the pull request; GITHUB_TOKEN does not.
          token: ${{ secrets.SPEC_UPDATE_TOKEN || github.token }}
          branch: chore/spec-update
          delete-branch: true
          commit-message: "chore(spec): update the iikoCloud API specification"
          title: "chore(spec): update the iikoCloud API specification"
          body-path: ${{ runner.temp }}/body.md
          labels: specification
