[project]
name = "iikocloudapi"
version = "1.0.0"
description = "Fully typed async client for the iikoCloud API, generated from the official OpenAPI specification"
authors = [{ name = "Deni Tazurkaev", email = "sha256deni@gmail.com" }]
license = "MIT"
license-files = ["LICENCE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "iiko",
  "iikocloud",
  "iiko-cloud",
  "iiko-api",
  "iikocloudapi",
  "iiko-cloud-api",
  "iikotransport",
  "async",
  "asyncio",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.5",
  "httpx2>=2.13.1,<3",
  "pydantic>=2.13.5,<3",
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/tdeni/iikocloudapi"
Documentation = "https://tdeni.github.io/iikocloudapi/"
Repository = "https://github.com/tdeni/iikocloudapi"
Changelog = "https://github.com/tdeni/iikocloudapi/blob/master/CHANGELOG.md"
Issues = "https://github.com/tdeni/iikocloudapi/issues"

[dependency-groups]
dev = [
  "anyio>=4.15.1",
  "jsonschema>=4.26.0",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
]
examples = [
  "fastapi>=0.143.0",
]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.7",
  "mkdocstrings-python>=2.0.9",
]

[tool.poetry]
packages = [{ include = "iikocloudapi" }]

[build-system]
requires = ["poetry-core>=2.5.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
# Generated code is formatted by `python -m codegen`, but not linted.
extend-exclude = ["iikocloudapi/models", "iikocloudapi/resources"]

[tool.ruff.format]
# Snippet includes (--8<--) are not Python.
exclude = ["docs/examples.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", "ISC001",  # conflict with the formatter
  "D",
  "ANN401",  # raw JSON is Any
  "EM101", "EM102", "TRY003",
  "FBT001", "FBT002",
  "PLR0913",  # API methods mirror request bodies
  "SLF001",  # resources call the client's transport
  "TD", "FIX",
  "CPY",
  "TC",  # pydantic needs runtime imports
  "ASYNC109",  # `timeout` is the iikoCloud server-side timeout
]

[tool.ruff.lint.isort]
known-first-party = ["iikocloudapi", "codegen"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "INP001", "ANN", "ARG", "C901", "PLR0912", "PLR0915", "DTZ001", "FBT003"]
"examples/**" = ["INP001", "T201", "S105", "S106", "ERA001", "BLE001"]
"codegen/**" = ["T201", "C901", "PLR0912", "PLR0915", "PLR0911", "S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error", "ignore::DeprecationWarning:iikocloudapi._auth"]

[tool.pyright]
include = ["iikocloudapi", "tests", "examples", "codegen"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["iikocloudapi"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
