name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.5.1"

jobs:
  lint:
    name: Lint, types, generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - run: poetry env use "${{ steps.python.outputs.python-path }}" && poetry install --all-groups
      - run: poetry run ruff format --check .
      - run: poetry run ruff check --output-format=github .
      - run: poetry run pyright
      - name: Generated code matches spec/iiko-cloud-api.json
        run: poetry run python -m codegen --check

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
        experimental: [false]
        include:
          # pydantic-core publishes 3.15 wheels only for pydantic 2.14+
          - python: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - run: poetry env use "${{ steps.python.outputs.python-path }}" && poetry install --with dev,examples
      - run: poetry run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.14'
        with:
          name: coverage
          path: coverage.xml

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - run: poetry env use "${{ steps.python.outputs.python-path }}" && poetry install --with docs
      - run: poetry run mkdocs build --strict
