name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "examples/**"
      - "iikocloudapi/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"
      - run: pipx install poetry==2.5.1
      - run: poetry env use "${{ steps.python.outputs.python-path }}" && poetry install --with docs
      - run: poetry run mkdocs build --strict --site-dir site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
